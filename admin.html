<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=1" />
    <title>Inventory Admin | Prime Time Miami</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dist/styles.css?v=31">
    <style>
    body { background: #000; color: #fff; }
    .ad-wrap { max-width: 1080px; margin: 0 auto; padding: 40px 20px 100px; }
    .ad-card { border: 1px solid rgba(255,255,255,0.16); padding: 28px; }
    .ad-label { display: block; color: rgba(255,255,255,0.55); font-size: 11px; letter-spacing: 0.18em; margin: 18px 0 6px; font-weight: 600; }
    .ad-input, .ad-select, .ad-textarea {
        width: 100%; box-sizing: border-box; background: transparent; color: #fff;
        border: none; border-bottom: 1px solid rgba(255,255,255,0.25);
        padding: 11px 2px; font-size: 15px; font-family: inherit; border-radius: 0;
        transition: border-color 0.3s ease; outline: none;
    }
    .ad-input:focus, .ad-select:focus, .ad-textarea:focus { border-bottom-color: #fff; }
    .ad-select option { background: #000; }
    .ad-textarea { min-height: 70px; resize: vertical; }
    .ad-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
    @media (max-width: 640px) { .ad-row { grid-template-columns: 1fr; } }
    .ad-banner { border: 1px solid rgba(255,255,255,0.3); padding: 16px 20px; font-size: 12px; letter-spacing: 0.08em; color: rgba(255,255,255,0.75); margin-bottom: 26px; line-height: 1.7; }
    .ad-list { border-top: 1px solid rgba(255,255,255,0.14); margin-top: 10px; }
    .ad-item { display: flex; align-items: center; gap: 16px; padding: 14px 2px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .ad-item img { width: 52px; height: 52px; object-fit: cover; background: #111; flex-shrink: 0; }
    .ad-item .nm { font-weight: 600; font-size: 14px; letter-spacing: 0.06em; }
    .ad-item .sub { color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 0.1em; margin-top: 2px; }
    .ad-item .sp { margin-left: auto; display: flex; gap: 10px; flex-shrink: 0; }
    .ad-mini { background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 10px; letter-spacing: 0.14em; padding: 8px 14px; cursor: pointer; transition: all 0.2s ease; font-weight: 600; }
    .ad-mini:hover { background: #fff; color: #000; }
    .ad-mini.danger:hover { background: #b91c1c; border-color: #b91c1c; color: #fff; }
    .ad-tag { font-size: 9px; letter-spacing: 0.14em; border: 1px solid rgba(255,255,255,0.25); padding: 3px 8px; color: rgba(255,255,255,0.6); }
    .ad-msg { font-size: 12px; letter-spacing: 0.08em; margin-top: 14px; min-height: 18px; }
    .ad-msg.ok { color: #4ade80; } .ad-msg.err { color: #f87171; }
    .ad-check { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); cursor: pointer; margin: 18px 24px 0 0; }
    .ad-check input { appearance: none; width: 14px; height: 14px; border: 1px solid rgba(255,255,255,0.4); background: transparent; cursor: pointer; margin: 0; }
    .ad-check input:checked { background: #fff; }
    .ad-preview { width: 120px; height: 120px; object-fit: cover; background: #111; border: 1px solid rgba(255,255,255,0.15); margin-top: 10px; display: none; }
    </style>
</head>
<body class="font-inter">
    <div class="ad-wrap">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px;">
            <img src="images/logo.png" alt="Prime Time Miami" style="height:34px;width:auto;">
            <div style="display:flex;gap:10px;">
                <a href="/inventory" class="ad-mini" style="text-decoration:none;display:inline-flex;align-items:center;">VIEW SITE</a>
                <button class="ad-mini" id="ad-logout" style="display:none;">LOG OUT</button>
            </div>
        </div>
        <h1 class="font-space font-bold text-2xl sm:text-3xl tracking-tight mb-6">Inventory Admin</h1>

        <div class="ad-banner hidden" id="ad-offline">
            TEST MODE — the real backend connects with the Supabase setup at launch.
            Password for testing: <b>primetime305</b>. Changes save in this browser only and show up on the local site.
        </div>

        <!-- LOGIN -->
        <div class="ad-card" id="ad-login">
            <label class="ad-label">PASSWORD</label>
            <input type="password" class="ad-input" id="ad-password" autocomplete="current-password">
            <button class="brutal-btn brutal-btn--solid w-full py-4 font-space font-bold tracking-widest text-xs mt-8" id="ad-login-btn">Log In</button>
            <div class="ad-msg" id="ad-login-msg"></div>
        </div>

        <!-- DASHBOARD -->
        <div class="hidden" id="ad-dash">
            <div class="ad-card" id="ad-form-card">
                <h2 class="font-space font-bold text-lg tracking-tight" id="ad-form-title">Add a piece</h2>
                <div class="ad-row">
                    <div><label class="ad-label">BRAND *</label><input class="ad-input" id="f-brand" placeholder="Rolex"></div>
                    <div><label class="ad-label">MODEL *</label><input class="ad-input" id="f-model" placeholder="Daytona"></div>
                    <div><label class="ad-label">REFERENCE</label><input class="ad-input" id="f-ref" placeholder="126500LN"></div>
                    <div><label class="ad-label">YEAR</label><input class="ad-input" id="f-year" placeholder="2024"></div>
                    <div><label class="ad-label">CASE MATERIAL</label><input class="ad-input" id="f-case" placeholder="Stainless Steel"></div>
                    <div><label class="ad-label">DIAL COLOR</label><input class="ad-input" id="f-dial" placeholder="Black"></div>
                    <div><label class="ad-label">CONDITION</label>
                        <select class="ad-select" id="f-cond">
                            <option value="">Select</option>
                            <option>Brand New</option>
                            <option>Unworn</option>
                            <option>Full Set</option>
                            <option>Excellent</option>
                            <option>Very Good</option>
                        </select>
                    </div>
                    <div><label class="ad-label">PHOTO</label><input type="file" accept="image/*" class="ad-input" id="f-photo" style="padding:8px 0;">
                        <img class="ad-preview" id="f-preview" alt=""></div>
                </div>
                <label class="ad-label">DESCRIPTION</label>
                <textarea class="ad-textarea" id="f-desc" placeholder="Short description shown on the piece page"></textarea>
                <label class="ad-check"><input type="checkbox" id="f-featured"> FEATURED (SHOWS FIRST)</label>
                <label class="ad-check"><input type="checkbox" id="f-sold"> SOLD (HIDDEN FROM SITE)</label>
                <button class="brutal-btn brutal-btn--solid w-full py-4 font-space font-bold tracking-widest text-xs mt-8" id="ad-save">Save Piece</button>
                <button class="ad-mini hidden" id="ad-cancel" style="margin-top:12px;">CANCEL EDIT</button>
                <div class="ad-msg" id="ad-save-msg"></div>
            </div>

            <h2 class="font-space font-bold text-lg tracking-tight mt-12 mb-2">Current pieces</h2>
            <input class="ad-input" id="ad-search" placeholder="Search brand, model, ref, year..." style="margin:6px 0 4px;">
            <div class="ad-msg" id="ad-count" style="margin:6px 0 0;color:rgba(255,255,255,0.4);"></div>
            <div class="ad-list" id="ad-list"></div>
        </div>
    </div>

    <script>
    (function () {
        var API = '/api/admin';
        var token = localStorage.getItem('pt_admin_token') || '';
        var editingId = null;
        var uploadedUrl = '';
        var demo = false;
        var DEMO_PW = 'primetime305';
        var $ = function (id) { return document.getElementById(id); };

        /* ── TEST MODE: full dashboard against localStorage until the real backend exists ── */
        function demoRead() {
            var raw = localStorage.getItem('pt_demo_pieces_v5');
            if (raw) return Promise.resolve(JSON.parse(raw));
            return fetch('/data/pieces.json').then(function (r) { return r.json(); }).then(function (seed) {
                localStorage.setItem('pt_demo_pieces_v5', JSON.stringify(seed));
                return seed;
            });
        }
        function demoWrite(rows) { localStorage.setItem('pt_demo_pieces_v5', JSON.stringify(rows)); }
        function demoPost(body) {
            if (body.action === 'login') {
                if (body.password === DEMO_PW) return Promise.resolve({ ok: true, status: 200, data: { token: 'demo' } });
                return Promise.resolve({ ok: false, status: 401, data: { error: 'Wrong password (test password: primetime305)' } });
            }
            if (body.action === 'list') {
                return demoRead().then(function (rows) {
                    return { ok: true, status: 200, data: { pieces: rows.map(function (p) {
                        return { id: p.id, brand: p.brand, model: p.model, ref: p.ref, year: p.year,
                                 case_material: p.caseMaterial, dial_color: p.dialColor, condition: p.condition,
                                 description: p.description, image: p.image, featured: p.featured, sold: p.sold };
                    }) } };
                });
            }
            if (body.action === 'upload') {
                return Promise.resolve({ ok: true, status: 200, data: { url: 'data:' + (body.contentType || 'image/jpeg') + ';base64,' + body.dataBase64 } });
            }
            if (body.action === 'save') {
                return demoRead().then(function (rows) {
                    var i = rows.findIndex(function (r) { return r.id === body.piece.id; });
                    if (i >= 0) rows[i] = body.piece; else rows.push(body.piece);
                    demoWrite(rows);
                    return { ok: true, status: 200, data: { ok: true } };
                });
            }
            if (body.action === 'delete') {
                return demoRead().then(function (rows) {
                    demoWrite(rows.filter(function (r) { return r.id !== body.id; }));
                    return { ok: true, status: 200, data: { ok: true } };
                });
            }
            return Promise.resolve({ ok: false, status: 400, data: { error: 'Unknown action' } });
        }

        function post(body) {
            if (demo) return demoPost(body);
            return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, data: j }; }); })
                .catch(function () { demo = true; return demoPost(body); });
        }
        function msg(id, text, ok) {
            var el = $(id); el.textContent = text; el.className = 'ad-msg ' + (ok ? 'ok' : 'err');
        }

        // status check: real backend or test mode
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status' }) })
            .then(function (r) { return r.json(); })
            .then(function (j) { if (!j.configured) { demo = true; $('ad-offline').classList.remove('hidden'); } })
            .catch(function () { demo = true; $('ad-offline').classList.remove('hidden'); });

        function showDash() {
            $('ad-login').classList.add('hidden');
            $('ad-dash').classList.remove('hidden');
            $('ad-logout').style.display = '';
            loadList();
        }

        $('ad-login-btn').addEventListener('click', function () {
            post({ action: 'login', password: $('ad-password').value }).then(function (r) {
                if (r.ok && r.data.token) {
                    token = r.data.token; localStorage.setItem('pt_admin_token', token);
                    showDash();
                } else msg('ad-login-msg', r.data.error || 'Login failed', false);
            });
        });
        $('ad-password').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('ad-login-btn').click(); });
        $('ad-logout').addEventListener('click', function () {
            localStorage.removeItem('pt_admin_token'); location.reload();
        });

        var allRows = [];
        function renderList() {
            var q = ($('ad-search').value || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
            var rows = allRows.filter(function (p) {
                if (!q.length) return true;
                var hay = [p.brand, p.model, p.ref, p.year, p.condition].join(' ').toLowerCase();
                return q.every(function (term) { return hay.indexOf(term) >= 0; });
            });
            $('ad-count').textContent = rows.length + ' OF ' + allRows.length + ' PIECES';
            $('ad-list').innerHTML = rows.map(function (p) {
                return '<div class="ad-item">' +
                    '<img src="' + (p.image || '') + '" alt="" loading="lazy">' +
                    '<div><div class="nm">' + p.brand + ' ' + p.model + '</div>' +
                    '<div class="sub">' + [p.ref, p.year, p.condition].filter(Boolean).join(' · ') + '</div></div>' +
                    (p.featured ? '<span class="ad-tag">FEATURED</span>' : '') +
                    (p.sold ? '<span class="ad-tag">SOLD</span>' : '') +
                    '<div class="sp">' +
                    '<button class="ad-mini" data-edit="' + p.id + '">EDIT</button>' +
                    '<button class="ad-mini danger" data-del="' + p.id + '">DELETE</button>' +
                    '</div></div>';
            }).join('') || '<div class="ad-item"><div class="sub">' + (allRows.length ? 'No pieces match this search.' : 'No pieces yet — add the first one above.') + '</div></div>';
            $('ad-list').querySelectorAll('[data-edit]').forEach(function (b) {
                b.addEventListener('click', function () { startEdit(allRows.find(function (p) { return p.id === b.getAttribute('data-edit'); })); });
            });
            $('ad-list').querySelectorAll('[data-del]').forEach(function (b) {
                b.addEventListener('click', function () {
                    if (!confirm('Delete this piece from the site?')) return;
                    post({ action: 'delete', token: token, id: b.getAttribute('data-del') }).then(loadList);
                });
            });
        }
        $('ad-search') && $('ad-search').addEventListener('input', renderList);
        function loadList() {
            post({ action: 'list', token: token }).then(function (r) {
                if (r.status === 401) { localStorage.removeItem('pt_admin_token'); location.reload(); return; }
                if (!r.ok) return;
                allRows = r.data.pieces || [];
                renderList();
            });
        }

        function startEdit(p) {
            if (!p) return;
            editingId = p.id; uploadedUrl = p.image || '';
            $('ad-form-title').textContent = 'Edit: ' + p.brand + ' ' + p.model;
            $('f-brand').value = p.brand || ''; $('f-model').value = p.model || '';
            $('f-ref').value = p.ref || ''; $('f-year').value = p.year || '';
            $('f-case').value = p.case_material || ''; $('f-dial').value = p.dial_color || '';
            $('f-cond').value = p.condition || ''; $('f-desc').value = p.description || '';
            $('f-featured').checked = !!p.featured; $('f-sold').checked = !!p.sold;
            if (p.image) { $('f-preview').src = p.image; $('f-preview').style.display = 'block'; }
            $('ad-cancel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        $('ad-cancel').addEventListener('click', function () { location.reload(); });

        // photo: resize client-side so uploads stay light
        $('f-photo').addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;
            var img = new Image();
            img.onload = function () {
                var max = 1400;
                var scale = Math.min(1, max / Math.max(img.width, img.height));
                var c = document.createElement('canvas');
                c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                var dataUrl = c.toDataURL('image/jpeg', 0.85);
                $('f-preview').src = dataUrl; $('f-preview').style.display = 'block';
                msg('ad-save-msg', 'Uploading photo…', true);
                post({
                    action: 'upload', token: token,
                    filename: file.name.replace(/\.[^.]+$/, '') + '.jpg',
                    contentType: 'image/jpeg',
                    dataBase64: dataUrl.split(',')[1]
                }).then(function (r) {
                    if (r.ok) { uploadedUrl = r.data.url; msg('ad-save-msg', 'Photo uploaded.', true); }
                    else msg('ad-save-msg', r.data.error || 'Upload failed', false);
                });
            };
            img.src = URL.createObjectURL(file);
        });

        $('ad-save').addEventListener('click', function () {
            var brand = $('f-brand').value.trim(), model = $('f-model').value.trim();
            if (!brand || !model) { msg('ad-save-msg', 'Brand and model are required.', false); return; }
            var id = editingId || (brand + '-' + model + '-' + Date.now()).toLowerCase().replace(/[^a-z0-9]+/g, '-');
            var piece = {
                id: id, brand: brand, model: model,
                ref: $('f-ref').value.trim(), year: $('f-year').value.trim(),
                caseMaterial: $('f-case').value.trim(), dialColor: $('f-dial').value.trim(),
                condition: $('f-cond').value, description: $('f-desc').value.trim(),
                image: uploadedUrl, featured: $('f-featured').checked, sold: $('f-sold').checked
            };
            msg('ad-save-msg', 'Saving…', true);
            post({ action: 'save', token: token, piece: piece }).then(function (r) {
                if (r.ok) {
                    msg('ad-save-msg', demo ? 'Saved (test mode — visible on the local site).' : 'Saved. Live on the site within a minute.', true);
                    editingId = null; uploadedUrl = '';
                    ['f-brand','f-model','f-ref','f-year','f-case','f-dial','f-desc'].forEach(function (i) { $(i).value = ''; });
                    $('f-cond').value = ''; $('f-featured').checked = false; $('f-sold').checked = false;
                    $('f-preview').style.display = 'none'; $('ad-cancel').classList.add('hidden');
                    $('ad-form-title').textContent = 'Add a piece';
                    loadList();
                } else msg('ad-save-msg', r.data.error || 'Save failed', false);
            });
        });

        if (token) showDash();
    })();
    </script>
    <script src="/scripts/premium-ui.js"></script>
</body>
</html>
